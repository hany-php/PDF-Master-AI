<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-opacity="0.2" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Decorative Glowing Orbs -->
  <circle cx="250" cy="150" r="180" fill="#2563eb" opacity="0.15" filter="url(#glow)" />
  <circle cx="950" cy="400" r="220" fill="#7c3aed" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="550" r="160" fill="#0ea5e9" opacity="0.1" filter="url(#glow)" />

  <!-- Top Brand Header -->
  <g transform="translate(80, 70)">
    <!-- App Logo Icon -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#accentGrad)" />
    <path d="M16 14h12a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H16a2 2 0 0 1-2-2V16a2 2 0 0 1 2-2z" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <path d="M20 22h8 M20 28h5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Project Title -->
    <text x="64" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">PDF Master AI</text>
    <text x="64" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">محرر ومساعد PDF الذكي المتكامل | All-in-One Intelligent PDF Suite</text>

    <!-- Badges -->
    <g transform="translate(800, 8)">
      <rect x="0" y="0" width="115" height="32" rx="16" fill="#1e293b" stroke="#334155" />
      <circle cx="16" cy="16" r="4" fill="#22c55e" />
      <text x="28" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Browser Native</text>

      <rect x="125" y="0" width="115" height="32" rx="16" fill="url(#aiGrad)" opacity="0.9" />
      <text x="145" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">AI-Powered</text>
    </g>
  </g>

  <!-- Central Visual: Modern PDF Editor Mockup Card -->
  <g transform="translate(80, 150)">
    <!-- Main App Window Frame -->
    <rect width="1040" height="410" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Title Bar -->
    <rect width="1040" height="44" rx="18" fill="#0f172a" />
    <rect y="26" width="1040" height="18" fill="#0f172a" />
    <circle cx="25" cy="22" r="5" fill="#ef4444" />
    <circle cx="42" cy="22" r="5" fill="#f59e0b" />
    <circle cx="59" cy="22" r="5" fill="#10b981" />
    
    <!-- Window Tabs / Status -->
    <rect x="90" y="10" width="180" height="24" rx="6" fill="#1e293b" />
    <text x="110" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">annual_report_2026.pdf</text>
    <rect x="280" y="10" width="140" height="24" rx="6" fill="#1e293b" opacity="0.6" />
    <text x="295" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">contract_final.pdf</text>

    <!-- Toolbar Strip -->
    <rect x="0" y="44" width="1040" height="46" fill="#1e293b" stroke="#334155" stroke-width="0.5" />
    
    <!-- Action Pills in Toolbar -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="85" height="30" rx="8" fill="#334155" />
      <text x="18" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Move</text>

      <rect x="95" y="0" width="95" height="30" rx="8" fill="#334155" />
      <text x="110" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">+ Add Text</text>

      <rect x="200" y="0" width="85" height="30" rx="8" fill="#334155" />
      <text x="215" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Eraser</text>

      <!-- Golden Unlock Native Elements Button -->
      <rect x="295" y="0" width="180" height="30" rx="8" fill="url(#amberGrad)" />
      <path d="M308 15 l3 3 l6 -6" stroke="#ffffff" stroke-width="2" fill="none" />
      <text x="325" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">تحرير عناصر الصفحة</text>

      <!-- Export Button -->
      <rect x="880" y="0" width="120" height="30" rx="8" fill="url(#accentGrad)" />
      <text x="900" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">تصدير PDF</text>
    </g>

    <!-- Editor Workspace Layout: Left Sidebar + Center Page + Right AI Chat -->
    
    <!-- Left Sidebar: Page Thumbnails -->
    <g transform="translate(20, 105)">
      <rect width="130" height="280" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">الصفحات (4)</text>
      
      <!-- Thumbnail 1 (Active) -->
      <rect x="15" y="38" width="100" height="68" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
      <rect x="25" y="48" width="50" height="4" rx="2" fill="#94a3b8" />
      <rect x="25" y="56" width="75" height="3" rx="1.5" fill="#cbd5e1" />
      <rect x="25" y="62" width="65" height="3" rx="1.5" fill="#cbd5e1" />
      <rect x="25" y="75" width="40" height="15" rx="3" fill="#e2e8f0" />

      <!-- Thumbnail 2 -->
      <rect x="15" y="116" width="100" height="68" rx="6" fill="#ffffff" opacity="0.8" />
      <rect x="25" y="126" width="60" height="4" rx="2" fill="#cbd5e1" />
      <rect x="25" y="134" width="80" height="3" rx="1.5" fill="#e2e8f0" />
      <rect x="25" y="140" width="70" height="3" rx="1.5" fill="#e2e8f0" />

      <!-- Thumbnail 3 -->
      <rect x="15" y="194" width="100" height="68" rx="6" fill="#ffffff" opacity="0.8" />
      <rect x="25" y="204" width="55" height="4" rx="2" fill="#cbd5e1" />
      <rect x="25" y="212" width="75" height="3" rx="1.5" fill="#e2e8f0" />
    </g>

    <!-- Center Canvas: Active Page with Unlocked Elements -->
    <g transform="translate(170, 105)">
      <!-- Main White PDF Page Sheet -->
      <rect width="520" height="280" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      
      <!-- Document Content Lines -->
      <rect x="35" y="30" width="180" height="16" rx="3" fill="#1e293b" />
      <rect x="35" y="55" width="420" height="6" rx="3" fill="#94a3b8" />
      <rect x="35" y="68" width="440" height="6" rx="3" fill="#cbd5e1" />
      <rect x="35" y="81" width="380" height="6" rx="3" fill="#cbd5e1" />

      <!-- Highlighted Section -->
      <rect x="35" y="105" width="220" height="22" rx="4" fill="#fef08a" opacity="0.7" />
      <rect x="42" y="112" width="190" height="8" rx="2" fill="#854d0e" />

      <!-- Active Auto-Expanding Edit Box Demonstration -->
      <g transform="translate(35, 145)">
        <!-- Dashed Selection Box -->
        <rect x="-4" y="-4" width="388" height="44" rx="8" fill="none" stroke="#2563eb" stroke-dasharray="4,4" stroke-width="2" />
        
        <!-- Live Floating Input Box -->
        <rect x="0" y="0" width="380" height="36" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#glow)" />
        <text x="14" y="23" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Welcome to your PDF Manager Suite</text>
        
        <!-- Update Button -->
        <rect x="270" y="5" width="75" height="26" rx="6" fill="#2563eb" />
        <text x="282" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">✓ Update</text>
        
        <!-- Close Button -->
        <rect x="350" y="5" width="24" height="26" rx="6" fill="#f1f5f9" />
        <text x="357" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748b">✕</text>
      </g>

      <!-- Signature Line at Bottom -->
      <g transform="translate(35, 220)">
        <text x="0" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Digital Verification &amp; Signature</text>
        <path d="M220 22 c10 -15, 25 10, 45 -10 s30 15, 50 -5" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <line x1="210" y1="28" x2="350" y2="28" stroke="#cbd5e1" stroke-width="1.5" />
      </g>
    </g>

    <!-- Right Sidebar: AI Assistant Panel -->
    <g transform="translate(710, 105)">
      <rect width="310" height="280" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      
      <!-- AI Header -->
      <g transform="translate(15, 18)">
        <rect x="0" y="0" width="28" height="28" rx="8" fill="url(#aiGrad)" />
        <circle cx="14" cy="14" r="5" fill="#ffffff" />
        <text x="38" y="19" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">مساعد الذكاء الاصطناعي</text>
      </g>

      <!-- AI Chat Bubble 1: Summary -->
      <rect x="15" y="60" width="280" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="25" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a855f7">ملخص المستند السريع:</text>
      <text x="25" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">يتناول التقرير النمو السنوي بنسبة 28%</text>
      <text x="25" y="115" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">مع تفاصيل العقود والميزانية التشغيلية.</text>

      <!-- AI Chat Bubble 2: User Prompt -->
      <rect x="45" y="145" width="250" height="42" rx="10" fill="#2563eb" />
      <text x="55" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#ffffff">ما هي شروط الدفع المذكورة؟</text>

      <!-- AI Chat Bubble 3: Response -->
      <rect x="15" y="195" width="280" height="45" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="25" y="215" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">الدفع يتم خلال 30 يوماً من استلام الفاتورة.</text>

      <!-- Input box -->
      <rect x="15" y="245" width="280" height="26" rx="6" fill="#090d16" stroke="#334155" />
      <text x="25" y="262" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#64748b">اسأل أي شيء حول ملف الـ PDF...</text>
    </g>
  </g>

  <!-- Bottom Feature Badges -->
  <g transform="translate(80, 580)">
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">⚡ استخراج وتعديل نصوص الصفحة الأصلية</text>
    <text x="290" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">📐 تكيف تلقائي للصناديق النصية</text>
    <text x="550" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🔒 خصوصية تامة - معالجة محلية 100%</text>
    <text x="820" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🌐 ثنائي اللغة (عربي / English)</text>
  </g>
</svg>
